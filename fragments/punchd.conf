[program:punchd]
command=/usr/local/bin/punchd-run.sh
autostart=true
autorestart=true
startsecs=3
; priority 大于默认的 999: 它要 supervisorctl 停/起 easytier, 得等后者先就位
priority=1010
; 打洞日志走 stdout (脚本只用 echo), stderr 留着接 python 的异常
stdout_logfile=/var/log/punchd.out.log
stderr_logfile=/var/log/punchd.err.log
